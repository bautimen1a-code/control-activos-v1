<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Activos Fijos y Fungibles</title>
<style>
  :root{
    --verde-mil:#2f3e2e;
    --verde-osc:#1c261b;
    --verde-claro:#4a5d47;
    --gris:#3a3a3a;
    --gris-claro:#d9d9d9;

    --color-fijos:#3d5a3d;
    --color-fijos-osc:#243824;
    --color-fungibles:#3a4a6b;
    --color-fungibles-osc:#222d45;
    --color-sector:#6b4a2b;
    --color-sector-osc:#3f2a17;
    --color-prestados:#6b2b4a;

  }

  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:#e8e6dc;
    color:var(--texto);

  .main-header{

  #resultado{padding:12px;}

  .tabla-seccion{

  .tabla-titulo{
    background:linear-gradient(180deg,var(--verde-mil),var(--verde-osc));

    background:var(--arena);color:var(--verde-osc);

  .tabla-seccion.fijos .tabla-titulo{background:linear-gradient(180deg,var(--color-fijos),var(--color-fijos-osc));}

  .tabla-seccion.prestados .tabla-titulo{background:linear-gradient(180deg,var(--color-prestados),var(--color-prestados-osc));}

  .oficina-tag{
    background:#e6e2cf;color:var(--verde-osc);
    font-size:11px;font-weight:700;padding:5px 10px;
    letter-spacing:1px;text-transform:uppercase;

  .tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .tabla-seccion.fungibles thead th{background:var(--color-fungibles);}
  .tabla-seccion.sector thead th{background:var(--color-sector);}
  .tabla-seccion.prestados thead th{background:var(--color-prestados);}

  tbody td{

  tbody tr:hover{background:#e2dfc9;}
  .pendiente{color:var(--rojo);font-weight:700;text-transform:uppercase;}
  .no-data{
    background:#f0eee2;color:#7a7360;text-align:center;padding:20px 12px;
    font-style:italic;font-size:12px;letter-spacing:1px;
    text-transform:uppercase;border-top:1px solid var(--verde-claro);
  }
  .estado-badge{
    display:inline-block;padding:2px 7px;border-radius:3px;
    font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;
  }
  .estado-malo{background:#8b3a2e;}
  .estado-regular{background:#8a7a3a;}
  .estado-bueno{background:#3d6b3a;}
  .estado-pendiente{background:var(--rojo);}

  .info-inicial{
    text-align:center;padding:40px 20px;color:#5c5644;
    font-size:13px;letter-spacing:1px;
  }
  .info-inicial .icon{font-size:38px;margin-bottom:10px;opacity:.5;}
  .loading,.error{text-align:center;padding:24px;font-size:13px;letter-spacing:1px;}
  .error{color:var(--rojo);}
  footer{
    text-align:center;padding:14px;font-size:10px;color:#7a7360;
    letter-spacing:1.5px;border-top:1px solid var(--gris-claro);
  }

  .lista-responsables{display:flex;flex-direction:column;gap:8px;padding:4px 0;}
  .lista-responsables .titulo-lista{
    font-size:11px;color:#5c5644;letter-spacing:1.5px;
    text-transform:uppercase;padding:6px 4px;
    border-bottom:1px solid #c9c2a8;margin-bottom:4px;

  .resp-item{
    background:#f4f2e8;border:1px solid var(--verde-claro);
    border-left:5px solid var(--verde-mil);
    padding:12px 14px;cursor:pointer;transition:all .15s ease;
    border-radius:2px;display:flex;justify-content:space-between;

  .resp-item-info{flex:1;min-width:0;}
  .resp-item-nombre{
    font-size:13px;font-weight:700;color:var(--verde-osc);
    letter-spacing:.3px;word-break:break-word;
  }
  .resp-item-cargo{
    font-size:11px;color:#5c5644;margin-top:3px;
    text-transform:uppercase;letter-spacing:.5px;word-break:break-word;
  }
  .resp-item-flecha{font-size:20px;color:var(--arena);flex-shrink:0;font-weight:700;}

  .btn-volver{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--verde-osc);color:#f2f0e5;
    border:1px solid var(--arena);padding:8px 14px;

  .btn-volver:hover{background:var(--verde-mil);}

    display:flex;flex-wrap:wrap;gap:8px;

<body>

<header class="main-header">
  <h1>Control de Activos Fijos y Fungibles</h1>
  <small>DIV-10 · SISTEMA DE CONSULTA</small>
</header>

<div class="search-wrap">
  <input type="text" id="buscador" placeholder="🔍 Buscar por Nombres y Apellidos..." autocomplete="off">
  <div class="search-hint">Escriba el nombre del responsable</div>
  <div class="botones-vista">
    <button class="btn-vista" data-tipo="fijos"     onclick="verGeneral('fijos')">Fijos</button>
    <button class="btn-vista" data-tipo="fungibles" onclick="verGeneral('fungibles')">Fungibles</button>
    <button class="btn-vista" data-tipo="sector"    onclick="verGeneral('sector')">Sector</button>
    <button class="btn-vista" data-tipo="prestados" onclick="verGeneral('prestados')">Prestados</button>
  </div>
</div>

<div id="resultado">
  <div class="info-inicial">
    <div class="icon">🎖️</div>
    INGRESE UN NOMBRE O TOQUE UN BOTÓN PARA VER EL INVENTARIO GENERAL
  </div>
</div>

<footer>SISTEMA DE CONTROL PATRIMONIAL — DIV-10</footer>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbznEnfYJJ6aB-tQ9A7dBBHUaP8P-CED9mVTgiDHlYHENeORQfWNAVzRpZp-0E5T1v2L/exec";

const FUENTES = {
  fijos:     "1hGj-Xai2iHo-IqiEC_VEdnJLx0Q0pHyrWns912Dfz6w",
  fungibles: "15m3IcYLXZPd70tbXkWR9fx7WT6DXVNPwIzxH--12-nY",
  sector:    "1aWAJYEUz313JgcAsPYYGM2wQLUjP_9LCsiIe2lAQ5so",
  prestados: "1tANUCBXaWH-jNQDjKrNoE7yIi-m4j0aPkf00uxcivd0"
};

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

function limpiarHeader(h){
  return h.toString().trim().toUpperCase()
    .replace(/\./g,"")
    .replace(/\s+/g," ")
    .trim();
}

function toObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(limpiarHeader);
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] || "").toString().trim());
    return obj;
  });
}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
const DATA = { fijos: [], fungibles: [], sector: [], prestados: [] };

async function cargarTodo(){
  await Promise.all([
    cargar("fijos", FUENTES.fijos),
    cargar("fungibles", FUENTES.fungibles),
    cargar("sector", FUENTES.sector),
    cargar("prestados", FUENTES.prestados)
  ]);
}

async function cargar(key, fileId){
  try{
    const res = await fetch(`${API_URL}?fileId=${fileId}`, {
      method: "GET", cache: "no-store", redirect: "follow"
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    let texto = await res.text();
    if(texto.trim().startsWith("<")) throw new Error("HTML en respuesta");
    if(texto.trim().startsWith("{")){
      try{ const j = JSON.parse(texto); if(j.error) throw new Error(j.error); }catch(_){}
    }
    const rows = parseCSV(texto);
    DATA[key] = toObjects(rows);
    console.log(`✔ ${key}: ${DATA[key].length} registros`);
  }catch(e){
    console.warn(`✖ Error cargando ${key}:`, e.message);
    DATA[key] = [];
  }
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderValor(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="pendiente">${esc(v)}</span>`;
  return esc(v);
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}

/* ============================================================
   IDENTIFICAR RESPONSABLE Y CARGO
   ============================================================ */
function getResponsable(obj){
  return (obj["GRADO NOMBRES"] || obj["RESPONSABLE"] || obj["NOMBRES"] || "").trim();
}
function getCargo(obj){
  return (obj["CARGO"] || "").trim();
}

/* ============================================================
   BÚSQUEDA DE RESPONSABLES
   ============================================================ */
function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 2) return [];

  const mapa = new Map();

  function escanear(lista){
    lista.forEach(o => {
      const nombreRaw = getResponsable(o);
      if(!nombreRaw) return;
      if(!norm(nombreRaw).includes(t)) return;
      const clave = norm(nombreRaw);
      if(!mapa.has(clave)){
        mapa.set(clave, {
          nombre: nombreRaw,
          cargo: getCargo(o),
          fijos: 0, fungibles: 0, sector: 0, prestados: 0
        });
      }
    });
  }

  escanear(DATA.fijos);
  escanear(DATA.fungibles);
  escanear(DATA.sector);
  escanear(DATA.prestados);

  const lista = Array.from(mapa.values());
  lista.forEach(r => {
    const clave = norm(r.nombre);
    r.fijos      = DATA.fijos.filter(o => norm(getResponsable(o)) === clave).length;
    r.fungibles  = DATA.fungibles.filter(o => norm(getResponsable(o)) === clave).length;
    r.sector     = DATA.sector.filter(o => norm(getResponsable(o)) === clave).length;
    r.prestados  = DATA.prestados.filter(o => norm(getResponsable(o)) === clave).length;
  });

  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

/* ============================================================
   LISTA DE RESPONSABLES
   ============================================================ */
function renderListaResponsables(termino){
  const cont = document.getElementById("resultado");

  if(norm(termino).length < 2){
    cont.innerHTML = `<div class="info-inicial">
      <div class="icon">🎖️</div>
      INGRESE UN NOMBRE O TOQUE UN BOTÓN PARA VER EL INVENTARIO GENERAL
    </div>`;
    return;
  }

  const lista = buscarResponsables(termino);

  if(!lista.length){
    cont.innerHTML = `<div class="info-inicial">
      <div class="icon">🔎</div>
      NO SE ENCONTRARON RESPONSABLES PARA "<b>${esc(termino)}</b>"
    </div>`;
    return;
  }

  let html = `<div class="lista-responsables">
    <div class="titulo-lista">${lista.length} responsable(s) encontrado(s)</div>`;

  lista.forEach((r, idx) => {
    const total = r.fijos + r.fungibles + r.sector + r.prestados;
    html += `
      <div class="resp-item" onclick="seleccionarResponsable(${idx})">
        <div class="resp-item-info">
          <div class="resp-item-nombre">🎖️ ${esc(r.nombre)}</div>
          <div class="resp-item-cargo">${esc(r.cargo || "SIN CARGO")} · ${total} bien(es)</div>
        </div>
        <div class="resp-item-flecha">›</div>
      </div>`;
  });

  html += `</div>`;
  cont.innerHTML = html;
  window.__listaActual = lista;
}

/* ============================================================
   SELECCIÓN DE RESPONSABLE
   ============================================================ */
function seleccionarResponsable(idx){
  const lista = window.__listaActual || [];
  const responsable = lista[idx];
  if(!responsable) return;

  const clave = norm(responsable.nombre);
  const filtrar = (arr) => arr.filter(o => norm(getResponsable(o)) === clave);

  renderDetalle(responsable, {
    fijos:     filtrar(DATA.fijos),
    fungibles: filtrar(DATA.fungibles),
    sector:    filtrar(DATA.sector),
    prestados: filtrar(DATA.prestados)
  });
}

/* ============================================================
   DEFINICIÓN DE COLUMNAS
   ------------------------------------------------------------
   Dos conjuntos:
   - DETALLE: al seleccionar un responsable (columnas operativas)
   - GENERAL: en vistas generales (todas las columnas excepto
              N° / NRO. y OFICINA/SECTOR)
   ============================================================ */
const COLUMNAS_DETALLE = {
  fijos: [
    {label:"CODIGOVSIAF", key:"CODIGOVSIAF"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"COSTO", key:"COSTO"},
    {label:"ESTADO", key:"ESTADO", render:"estado"}
  ],
  fungibles: [
    {label:"CÓDIGO", key:"CODIGO"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"VALOR TOTAL", key:"VALOR TOTAL"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"}
  ],
  sector: [
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"},
    {label:"OBS", key:"OBS"}
  ],
  prestados: [
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"},
    {label:"OBS", key:"OBS"}
  ]
};

const COLUMNAS_GENERAL = {
  fijos: [
    {label:"GRADO NOMBRES", key:"GRADO NOMBRES"},
    {label:"CARGO", key:"CARGO"},
    {label:"CODIGOVSIAF", key:"CODIGOVSIAF"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"COSTO", key:"COSTO"},
    {label:"ESTADO", key:"ESTADO", render:"estado"}
  ],
  fungibles: [
    {label:"GRADO NOMBRES", key:"GRADO NOMBRES"},
    {label:"CARGO", key:"CARGO"},
    {label:"CÓDIGO", key:"CODIGO"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"VALOR TOTAL", key:"VALOR TOTAL"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"}
  ],
  sector: [
    {label:"GRADO NOMBRES", key:"GRADO NOMBRES"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"},
    {label:"OBS", key:"OBS"}
  ],
  prestados: [
    {label:"GRADO NOMBRES", key:"GRADO NOMBRES"},
    {label:"DESCRIPCIÓN DEL ACTIVO", key:"DESCRIPCION DEL ACTIVO"},
    {label:"CANTIDAD", key:"CANTIDAD"},
    {label:"ESTADO", key:"ESTADO", render:"estado"},
    {label:"OBS", key:"OBS"}
  ]
};

/* ============================================================
   RENDER DE TABLA
   ------------------------------------------------------------
   opciones:
   - ocultarSiVacio: si true y lista vacía, no genera NADA
     (usado para ARTÍCULOS PRESTADOS en detalle por responsable)
   ============================================================ */
function agruparPorOficina(lista){
  const mapa = new Map();
  lista.forEach(o => {
    const ofi = (o["OFICINA/SECTOR"] || o["OFICINA / SECTOR"] || o["OFICINA"] || "SIN OFICINA").trim();
    if(!mapa.has(ofi)) mapa.set(ofi, []);
    mapa.get(ofi).push(o);
  });
  return mapa;
}

function tablaHTML(titulo, lista, columnas, tipoClase, opciones){
  opciones = opciones || {};
  const clase = tipoClase || "";

  /* Ocultar completamente si está vacío y así se pidió */
  if(opciones.ocultarSiVacio && !lista.length){
    return "";
  }

  let html = `<div class="tabla-seccion ${clase}">
    <div class="tabla-titulo">
      <span>${titulo}</span>
      <span class="count">${lista.length}</span>
    </div>`;

  if(!lista.length){
    html += `<div class="no-data">NO CUENTA ${titulo}</div></div>`;
    return html;
  }

  const grupos = agruparPorOficina(lista);
  for(const [oficina, items] of grupos){
    html += `<div class="oficina-tag">📍 ${esc(oficina)}</div>`;
    html += `<div class="tabla-scroll"><table><thead><tr>`;
    columnas.forEach(c => html += `<th>${c.label}</th>`);
    html += `</tr></thead><tbody>`;
    items.forEach(item => {
      html += "<tr>";
      columnas.forEach(c => {
        const val = (c.render === "estado") ? renderEstado(item[c.key]) : renderValor(item[c.key]);
        html += `<td>${val}</td>`;
      });
      html += "</tr>";
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  return html;
}

/* ============================================================
   RENDER — DETALLE DEL RESPONSABLE
   ============================================================ */
function renderDetalle(responsable, datos){
  const cont = document.getElementById("resultado");

  let html = `
    <div class="acciones-detalle">
      <button class="btn-volver" onclick="volverALista()">← Volver a resultados</button>
    </div>
    <div class="resp-card">
      <div class="nombre">🎖️ ${esc(responsable.nombre)}</div>
      ${responsable.cargo ? `<div class="cargo">${esc(responsable.cargo)}</div>` : ``}
    </div>`;

  /* FIJOS, FUNGIBLES y SECTOR: se muestran siempre (con "NO CUENTA..." si vacío) */
  html += tablaHTML("FIJOS", datos.fijos, COLUMNAS_DETALLE.fijos, "fijos");
  html += tablaHTML("FUNGIBLES", datos.fungibles, COLUMNAS_DETALLE.fungibles, "fungibles");
  html += tablaHTML("SECTOR", datos.sector, COLUMNAS_DETALLE.sector, "sector");

  /* ARTÍCULOS PRESTADOS: solo si tiene registros */
  html += tablaHTML(
    "ARTÍCULOS PRESTADOS",
    datos.prestados,
    COLUMNAS_DETALLE.prestados,
    "prestados",
    { ocultarSiVacio: true }
  );

  cont.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function volverALista(){
  const input = document.getElementById("buscador");
  renderListaResponsables(input.value);
}

/* ============================================================
   VISTAS GENERALES (todas las columnas)
   ============================================================ */
function verGeneral(tipo){
  const cont = document.getElementById("resultado");

  document.querySelectorAll(".btn-vista").forEach(b => b.classList.remove("active"));
  const botonActivo = document.querySelector(`.btn-vista[data-tipo="${tipo}"]`);
  if(botonActivo) botonActivo.classList.add("active");

  const titulos = {
    fijos: "FIJOS",
    fungibles: "FUNGIBLES",
    sector: "SECTOR",
    prestados: "ARTÍCULOS PRESTADOS"
  };

  const lista = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  let html = `
    <div class="acciones-detalle">
      <button class="btn-volver" onclick="volverALista()">← Volver a resultados</button>
    </div>
    <div class="resp-card" style="border-left-color:var(--arena)">
      <div class="nombre">📋 INVENTARIO GENERAL — ${titulo}</div>
      <div class="cargo">Mostrando los ${lista.length} registros totales</div>
    </div>`;

  /* En vista general: sin opción de ocultar, con TODAS las columnas */
  html += tablaHTML(titulo, lista, COLUMNAS_GENERAL[tipo] || [], tipo);

  cont.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", async () => {
  const cont = document.getElementById("resultado");
  cont.innerHTML = `<div class="loading">⏳ CARGANDO BASE DE DATOS...</div>`;

  await cargarTodo();

  const errores = [];
  if(!DATA.fijos.length) errores.push("FIJOS");
  if(!DATA.fungibles.length) errores.push("FUNGIBLES");
  if(!DATA.sector.length) errores.push("SECTOR");
  /* PRESTADOS puede estar vacío legítimamente, no lo listamos como error */

  if(errores.length === 3){
    cont.innerHTML = `<div class="error">
      ⚠️ NO SE PUDO CARGAR NINGÚN ARCHIVO<br><br>
      Revise la consola (F12) para ver detalles.
    </div>`;
  } else {
    cont.innerHTML = `<div class="info-inicial">
      <div class="icon">🎖️</div>
      INGRESE UN NOMBRE O TOQUE UN BOTÓN PARA VER EL INVENTARIO GENERAL
      ${errores.length ? `<br><br><small style="color:#c0392b">⚠️ Sin datos: ${errores.join(", ")}</small>` : ""}
    </div>`;
  }

  const input = document.getElementById("buscador");
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    document.querySelectorAll(".btn-vista").forEach(b => b.classList.remove("active"));
    timer = setTimeout(() => renderListaResponsables(e.target.value), 200);
  });
});
</script>
